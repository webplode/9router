# Persistent 9Router stack — data survives container restart, rebuild, and `docker compose up --build`.
#
# Quick start:
#   docker compose up -d --build
#   open http://localhost:20128
#
# Data lives in Docker volume `9router-data` (or bind mount below).

services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:local
    container_name: 9router
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 20128
      DATA_DIR: /app/data
      NEXT_TELEMETRY_DISABLED: "1"
      # Optional: DEBUG=true
      # Optional Headroom sidecar: HEADROOM_URL=http://headroom:8787
    volumes:
      # Named volume — retained across `docker compose down` (without -v) and image rebuilds
      - 9router-data:/app/data
      # Alternative: bind mount to host (easier backup / inspect)
      # - ./data/9router:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:20128/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  9router-data:
    name: 9router-data